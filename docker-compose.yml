services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ../post-it:/packages/post-it:ro
    environment:
      - POSTIT_DESK_DEBUG=true
      - POSTIT_ENDPOINTS_MODULE=/packages/post-it/sfm_endpoints.py
      - PYTHONPATH=/packages/post-it:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
