name: Release

on:
  push:
    branches:
      - "release/**"

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --no-sources --group dev

      - name: Run backend tests
        working-directory: backend
        run: uv run --no-sources pytest tests/ -v --tb=short

  frontend-checks:
    name: Frontend Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

  # ── Tauri Builds ──────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    needs: [backend-tests, frontend-checks]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build backend sidecar
        working-directory: backend
        run: |
          uv sync --no-sources --group dev
          TRIPLE=$(rustc -Vv | grep host | cut -d' ' -f2)
          uv run --no-sources pyinstaller \
            --name restful-notebooks-server \
            --onedir --noconfirm \
            --distpath ../src-tauri/binaries/sidecar-build \
            --collect-all restful --collect-all app \
            --hidden-import yaml --hidden-import pydantic --hidden-import sqlalchemy \
            __main__.py
          cp ../src-tauri/binaries/sidecar-build/restful-notebooks-server/restful-notebooks-server \
             ../src-tauri/binaries/restful-notebooks-server-${TRIPLE}

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Tauri app
        working-directory: src-tauri
        run: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: restful-notebooks-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    needs: [backend-tests, frontend-checks]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build backend sidecar
        working-directory: backend
        shell: bash
        run: |
          uv sync --no-sources --group dev
          TRIPLE=$(rustc -Vv | grep host | cut -d' ' -f2)
          uv run --no-sources pyinstaller \
            --name restful-notebooks-server \
            --onedir --noconfirm \
            --distpath ../src-tauri/binaries/sidecar-build \
            --collect-all restful --collect-all app \
            --hidden-import yaml --hidden-import pydantic --hidden-import sqlalchemy \
            __main__.py
          cp ../src-tauri/binaries/sidecar-build/restful-notebooks-server/restful-notebooks-server.exe \
             "../src-tauri/binaries/restful-notebooks-server-${TRIPLE}.exe"

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Tauri app
        working-directory: src-tauri
        run: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: restful-notebooks-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-22.04
    needs: [backend-tests, frontend-checks]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build backend sidecar
        working-directory: backend
        run: |
          uv sync --no-sources --group dev
          TRIPLE=$(rustc -Vv | grep host | cut -d' ' -f2)
          uv run --no-sources pyinstaller \
            --name restful-notebooks-server \
            --onedir --noconfirm \
            --distpath ../src-tauri/binaries/sidecar-build \
            --collect-all restful --collect-all app \
            --hidden-import yaml --hidden-import pydantic --hidden-import sqlalchemy \
            __main__.py
          cp ../src-tauri/binaries/sidecar-build/restful-notebooks-server/restful-notebooks-server \
             ../src-tauri/binaries/restful-notebooks-server-${TRIPLE}

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Tauri app
        working-directory: src-tauri
        run: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: restful-notebooks-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
            src-tauri/target/release/bundle/deb/*.deb

  # ── GitHub Release ──────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks, build-macos, build-windows, build-linux]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${GITHUB_REF#refs/heads/release/}"
          VERSION="${BRANCH#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Restful Notebooks ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/restful-notebooks-macos/*
            release-assets/restful-notebooks-windows/*
            release-assets/restful-notebooks-linux/*
