name: Release

on:
  push:
    branches:
      - "release/**"

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --no-sources

      - name: Verify backend imports
        working-directory: backend
        run: uv run --no-sources python -c "from app.main import app; print('Backend import OK')"

  frontend-checks:
    name: Frontend Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

  # ── Electron Builds ──────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    needs: [backend-tests, frontend-checks]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install backend + dev dependencies
        working-directory: backend
        run: uv sync --no-sources --group dev

      - name: Bundle backend with PyInstaller
        working-directory: backend
        run: |
          uv run --no-sources pyinstaller \
            --name restful-notebooks-server \
            --onedir \
            --noconfirm \
            --distpath ../dist/backend \
            --add-data "../frontend/dist:static" \
            --collect-all restful \
            --hidden-import uvloop \
            --hidden-import httptools \
            __main__.py

      - name: Package with electron-builder
        working-directory: electron
        run: npm install && npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: restful-notebooks-macos
          path: |
            dist/electron/*.dmg
            dist/electron/*.zip
            dist/electron/latest-mac.yml

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    needs: [backend-tests, frontend-checks]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install backend + dev dependencies
        working-directory: backend
        run: uv sync --no-sources --group dev

      - name: Bundle backend with PyInstaller
        working-directory: backend
        run: |
          uv run --no-sources pyinstaller `
            --name restful-notebooks-server `
            --onedir `
            --noconfirm `
            --distpath ../dist/backend `
            --add-data "../frontend/dist;static" `
            --collect-all restful `
            --hidden-import uvloop `
            --hidden-import httptools `
            __main__.py

      - name: Package with electron-builder
        working-directory: electron
        run: npm install && npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: restful-notebooks-windows
          path: |
            dist/electron/*.exe
            dist/electron/latest.yml

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install backend + dev dependencies
        working-directory: backend
        run: uv sync --no-sources --group dev

      - name: Bundle backend with PyInstaller
        working-directory: backend
        run: |
          uv run --no-sources pyinstaller \
            --name restful-notebooks-server \
            --onedir \
            --noconfirm \
            --distpath ../dist/backend \
            --add-data "../frontend/dist:static" \
            --collect-all restful \
            --hidden-import uvloop \
            --hidden-import httptools \
            __main__.py

      - name: Package with electron-builder
        working-directory: electron
        run: npm install && npx electron-builder --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: restful-notebooks-linux
          path: |
            dist/electron/*.AppImage
            dist/electron/latest-linux.yml

  # ── GitHub Release ──────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks, build-macos, build-windows, build-linux]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${GITHUB_REF#refs/heads/release/}"
          VERSION="${BRANCH#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Restful Notebooks ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/restful-notebooks-macos/*
            release-assets/restful-notebooks-windows/*
            release-assets/restful-notebooks-linux/*
