name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - macos
          - windows
          - linux

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    if: inputs.platform == 'all' || inputs.platform == 'macos'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install restful wheel from latest release
        run: |
          WHEEL_URL=$(gh api repos/joshuajerome/restful/releases/latest \
            --jq '.assets[] | select(.name | endswith(".whl")) | .browser_download_url')
          if [ -n "$WHEEL_URL" ]; then pip install "$WHEEL_URL"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Bundle backend with PyInstaller
        working-directory: backend
        run: |
          uv run pyinstaller \
            --name restful-notebooks-server \
            --onedir --noconfirm \
            --distpath ../dist/backend \
            --add-data "../frontend/dist:static" \
            --collect-all restful \
            --hidden-import uvloop --hidden-import httptools \
            __main__.py

      - name: Package with electron-builder
        working-directory: electron
        run: npm install && npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: restful-notebooks-macos
          path: dist/electron/*
          retention-days: 30

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    if: inputs.platform == 'all' || inputs.platform == 'windows'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install restful wheel from latest release
        shell: bash
        run: |
          WHEEL_URL=$(gh api repos/joshuajerome/restful/releases/latest \
            --jq '.assets[] | select(.name | endswith(".whl")) | .browser_download_url')
          if [ -n "$WHEEL_URL" ]; then pip install "$WHEEL_URL"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Bundle backend with PyInstaller
        working-directory: backend
        run: |
          uv run pyinstaller `
            --name restful-notebooks-server `
            --onedir --noconfirm `
            --distpath ../dist/backend `
            --add-data "../frontend/dist;static" `
            --collect-all restful `
            --hidden-import uvloop --hidden-import httptools `
            __main__.py

      - name: Package with electron-builder
        working-directory: electron
        run: npm install && npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: restful-notebooks-windows
          path: dist/electron/*
          retention-days: 30

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    if: inputs.platform == 'all' || inputs.platform == 'linux'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install restful wheel from latest release
        run: |
          WHEEL_URL=$(gh api repos/joshuajerome/restful/releases/latest \
            --jq '.assets[] | select(.name | endswith(".whl")) | .browser_download_url')
          if [ -n "$WHEEL_URL" ]; then pip install "$WHEEL_URL"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Bundle backend with PyInstaller
        working-directory: backend
        run: |
          uv run pyinstaller \
            --name restful-notebooks-server \
            --onedir --noconfirm \
            --distpath ../dist/backend \
            --add-data "../frontend/dist:static" \
            --collect-all restful \
            --hidden-import uvloop --hidden-import httptools \
            __main__.py

      - name: Package with electron-builder
        working-directory: electron
        run: npm install && npx electron-builder --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: restful-notebooks-linux
          path: dist/electron/*
          retention-days: 30
