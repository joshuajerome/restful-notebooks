name: CI

on:
  push:
    branches:
      - "feat/**"
      - "bug/**"
      - "claude/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - staging
      - integration

jobs:
  # ── Auto-label and assign on PR open ────────────────────────────────────────
  auto-label:
    name: Label & Assign PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'

    permissions:
      pull-requests: write

    steps:
      - name: Apply label and assignee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          BRANCH="${{ github.head_ref }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"

          gh pr edit "$PR" --repo "${{ github.repository }}" --add-assignee "$AUTHOR"

          if echo "$BRANCH" | grep -qE '^feat/'; then
            LABEL="feature"
            COLOR="0075ca"
            DESC="New feature or capability"
          elif echo "$BRANCH" | grep -qE '^bug/'; then
            LABEL="bugfix"
            COLOR="d73a4a"
            DESC="Bug fix"
          elif echo "$BRANCH" | grep -qE '^docs/'; then
            LABEL="documentation"
            COLOR="006b75"
            DESC="Documentation update"
          elif echo "$BRANCH" | grep -qE '^(gh|claude)/'; then
            LABEL="automation"
            COLOR="e4e669"
            DESC="CI/CD or automation change"
          else
            LABEL="feature"
            COLOR="0075ca"
            DESC="New feature or capability"
          fi

          gh label create "$LABEL" --color "$COLOR" --description "$DESC" \
            --force --repo "${{ github.repository }}" 2>/dev/null || true
          gh pr edit "$PR" --repo "${{ github.repository }}" --add-label "$LABEL"

  # ── Backend Tests ───────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest tests/ -v --tb=short

  # ── Frontend Lint & Type Check ──────────────────────────────────────────────
  frontend-checks:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

  # ── Docs Build ──────────────────────────────────────────────────────────────
  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install docs dependencies
        run: |
          uv venv .venv
          uv pip install mkdocs-material "mkdocs<2.0" mkdocs-callouts

      - name: Build docs (strict)
        run: uv run mkdocs build --strict
