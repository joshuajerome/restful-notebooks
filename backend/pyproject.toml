[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "restful-notebooks-backend"
version = "0.1.0"
description = "Restful Notebooks backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "restful-sdk",
    "python-multipart>=0.0.9",
]

[tool.uv.sources]
restful-sdk = { path = "../../post-it", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "ty>=0.0.1a0",
    "pyinstaller>=6.0",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.setuptools]
package-dir = { "" = "." }
